[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phlatline"]

[project]
name = "phlatline-core"
version = "3.0.0"
description = "OpenAPI-driven API diagnostic CLI — BSL 1.1 licensed"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Phlatline", email = "hi@phlatline.dev" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click >= 8.1",
    "pydantic >= 2.5",
    "pydantic-settings >= 2.2",
    "httpx >= 0.27",
    "pyyaml >= 6.0",
    "jinja2 >= 3.1",
]

[project.optional-dependencies]
# Fuzzing is optional at runtime — phlatline.core.fuzzer degrades gracefully
# when Schemathesis is absent. 4.0 is the floor: the fuzzer uses the
# `schemathesis.openapi.from_path` / `schema.config` API introduced there.
fuzz = [
    "schemathesis >= 4.0",
]
dev = [
    "pytest >= 8.0",
    "pytest-bdd >= 7.0",
    "pytest-cov >= 5.0",
    "pytest-asyncio >= 0.23",
    "hypothesis >= 6.100",
    "respx >= 0.21",
    "ruff >= 0.5",
    "mypy >= 1.10",
    "bandit >= 1.7",
]
docs = [
    "mkdocs-material >= 9.5",
    "mkdocs-minify-plugin >= 0.8",
]

[project.urls]
Homepage = "https://phlatline.dev"
Repository = "https://github.com/snoodleboot-io/phlatline-core"
Documentation = "https://snoodleboot-io.github.io/phlatline-core/"
Issues = "https://github.com/snoodleboot-io/phlatline-core/issues"

[project.scripts]
phlatline = "phlatline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=phlatline",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
bdd_features_base_dir = "tests/features/"
# Collect classes named TestSuite* (our naming convention for unit-test groups)
# while avoiding pytest collecting Pydantic models named TestCase/TestResult/TestStatus.
python_classes = ["TestSuite*"]

[tool.coverage.run]
source = ["phlatline"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 85  # S1.1.1 target

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit (security)
    "UP",           # pyupgrade
    "SIM",          # simplify
]
ignore = [
    "S101",  # assert used (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]  # tests can use assert freely

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
