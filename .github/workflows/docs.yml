name: Docs

# Builds the MkDocs site and deploys to GitHub Pages on push to main.
# The CLI reference is regenerated from the live Click command tree first.

on:
  push:
    branches: [main]

permissions:
  contents: write  # mkdocs gh-deploy pushes to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + docs deps
        run: pip install -e ".[docs]"
      - name: Regenerate CLI reference
        run: python scripts/gen_cli_reference.py
      - name: Build + deploy to gh-pages
        run: mkdocs gh-deploy --force --strict
